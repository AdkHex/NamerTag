name: 'Release NamerTag'

# Releases are driven by the version in src-tauri/tauri.conf.json. Pushing to main with a
# bumped version cuts the tag and publishes automatically; pushing an ordinary commit does
# nothing. Tags and manual dispatch still work for one-off releases.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

concurrency:
  group: namertag-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Decide whether this push should release, and under which tag. A push to main releases
  # only when tauri.conf.json's version has no corresponding tag yet, so re-running or
  # pushing unrelated commits never republishes the same version.
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should-release: ${{ steps.decide.outputs.should-release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide release
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: releasing ${version}"
            exit 0
          fi

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "Tag push: releasing ${{ github.ref_name }}"
            exit 0
          fi

          # The three manifests must agree, or the built app reports a version that differs
          # from the release it came from and the updater compares the wrong numbers.
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg_version="$(node -p "require('./package.json').version")"
          cargo_version="$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)"
          if [ "$tauri_version" != "$pkg_version" ] || [ "$tauri_version" != "$cargo_version" ]; then
            echo "Version mismatch: tauri.conf.json=$tauri_version package.json=$pkg_version Cargo.toml=$cargo_version" >&2
            exit 1
          fi

          # Push to main: release only if the configured version has no tag yet.
          version="v${tauri_version}"
          if git rev-parse "${version}" >/dev/null 2>&1; then
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            echo "${version} already tagged — nothing to release."
          else
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "New version ${version} detected — releasing."
          fi

      - name: Create tag
        if: steps.decide.outputs.should-release == 'true' && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "NamerTag $VERSION"
          git push origin "$VERSION"

  publish-tauri-macos:
    needs: version-check
    if: needs.version-check.outputs.should-release == 'true'
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify updater public key is configured
        shell: bash
        run: |
          node -e "const c=require('./src-tauri/tauri.conf.json'); const k=c?.plugins?.updater?.pubkey; if(!k||k.includes('YOUR_UPDATER_PUBLIC_KEY_HERE')){ console.error('Updater pubkey is not configured in src-tauri/tauri.conf.json (plugins.updater.pubkey).'); process.exit(1);} console.log('Updater pubkey is configured.');"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version-check.outputs.version }}
          releaseName: 'NamerTag ${{ needs.version-check.outputs.version }}'
          releaseBody: |
            ## 🚀 NamerTag ${{ needs.version-check.outputs.version }}

            ### Installation Instructions
            - **Windows**: Download the installer (`.msi` or `.exe`) and run it
            - **macOS**: Download the `.dmg` file and drag to Applications folder

            ### Auto-Updates
            Existing users will receive automatic update notifications.

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ needs.version-check.outputs.version }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles app,dmg

  publish-tauri-windows:
    needs: version-check
    if: needs.version-check.outputs.should-release == 'true'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify updater public key is configured
        shell: bash
        run: |
          node -e "const c=require('./src-tauri/tauri.conf.json'); const k=c?.plugins?.updater?.pubkey; if(!k||k.includes('YOUR_UPDATER_PUBLIC_KEY_HERE')){ console.error('Updater pubkey is not configured in src-tauri/tauri.conf.json (plugins.updater.pubkey).'); process.exit(1);} console.log('Updater pubkey is configured.');"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version-check.outputs.version }}
          releaseName: 'NamerTag ${{ needs.version-check.outputs.version }}'
          releaseBody: |
            ## 🚀 NamerTag ${{ needs.version-check.outputs.version }}

            ### Installation Instructions
            - **Windows**: Download the installer (`.msi` or `.exe`) and run it
            - **macOS**: Download the `.dmg` file and drag to Applications folder

            ### Auto-Updates
            Existing users will receive automatic update notifications.

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ needs.version-check.outputs.version }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis,msi
